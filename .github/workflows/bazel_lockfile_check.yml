name: Bazel lockfile check

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  release:
    types: [published]

jobs:

  check_bazel_lockfile:
    uses: eclipse-score/cicd-workflows/.github/workflows/bzlmod-lock-check.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      contents: read
