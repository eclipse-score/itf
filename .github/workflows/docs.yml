name: Verify and Build Docs

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  release:
    types: [created]

jobs:
  docs-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-verify.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      pull-requests: write
      contents: read
    with:
      bazel-docs-verify-target: "//:docs"

  docs-build:
    needs: [docs-verify]
    if: github.event_name != 'pull_request'
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      contents: read
    with:
      bazel-target: "//:docs"
      retention-days: 3

  docs-deploy:
    needs: [docs-build]
    if: >-
      (github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
      github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: _site
      - name: Verify the site entry point
        run: test -s _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          name: itf-pages-site
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: itf-pages-site
