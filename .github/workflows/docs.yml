name: Verify and Build Docs

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  release:
    types: [created]

jobs:
  # The documentation site serves the pack marketplace (docs/_generated/catalog.html), which is the contract
  # map over all ITF packs (`itf contracts map --format html`), generated from the packs' code and definitions.
  # The Sphinx build only sees source files, so it is regenerated here on every docs run and the run fails
  # when the checked-in copy differs: the published marketplace is never stale. The same holds for the
  # contracts reference (docs/reference/contracts.md), generated from the supported definitions.
  marketplace:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
      - name: Regenerate the pack marketplace
        run: bazel run //score/itf/cli:itf -- contracts map --format html --output docs/_generated/catalog.html
      - name: Regenerate the contracts reference
        run: bazel run //score/itf/cli:itf -- contracts reference --output docs/reference/contracts.md
      - name: Fail when a checked-in generated page is stale
        run: git diff --exit-code docs/_generated/catalog.html docs/reference/contracts.md

  docs-verify:
    needs: [marketplace]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: eclipse-score/cicd-workflows/.github/workflows/docs-verify.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      pull-requests: write
      contents: read
    with:
      bazel-docs-verify-target: "//:docs"

  docs-build:
    needs: [marketplace, docs-verify]
    if: github.event_name != 'pull_request'
    uses: eclipse-score/cicd-workflows/.github/workflows/docs.yml@8d80e8df150cae21d53cbc8031d0f970648f7a67 # v0.0.3
    permissions:
      contents: write
      pages: write
      pull-requests: write
      id-token: write
    with:
      bazel-target: "//:docs -- --github_user=${{ github.repository_owner }} --github_repo=${{ github.event.repository.name }}"
      retention-days: 3
