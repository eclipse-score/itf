# The ITF team's rules for the contracts its own packs use, checked in CI:
#   bazel run //score/itf/cli:itf -- contracts check --rules tools/contract_rules.yaml
namespaces:
  - application
  - capture
  - console
  - descriptor
  - exec
  - files
  - image
  - logs
  - net
  - network
  - observe
  - platform
  - shell
forbid_stability:
  - deprecated
require_major: []
