contracts:
  - contract: platform.up
    kind: state
    version: 1
    summary: The platform exists and is running.
    description: >
      The root of most plans: command, process, file, console and shell actions require it. Delivered by
      the start action of the platform's pack (host directory, container, virtual machine) or by waiting for a
      machine that boots on its own (ICMP). Invalidated by restart.
    probe: The platform reports running().
    see_also:
      - platform.instance
      - shell.open
