contracts:
  - contract: shell.open
    kind: state
    version: 1
    summary: A shell session is connected and can run commands.
    description: >
      Delivered by the action that connects an exec.shell node (SSH). It requires the platform to be up
      and is invalidated by anything that drops the connection, such as a restart. Reaching it again after
      a restart reconnects.
    probe: The session reports it is connected.
    see_also:
      - exec.shell
      - platform.up
      - network.reachable
