contracts:
  - contract: capture.running
    kind: state
    version: 1
    summary: A packet capture is running.
    description: >
      Delivered by the capture action of a pack (on the host or on a platform interface). Anything that
      sends the traffic under test should require it so the first packets are not lost.
    probe: The capture process is alive.
    see_also:
      - observe.capture
      - platform.up
