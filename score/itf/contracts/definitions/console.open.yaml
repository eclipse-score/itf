contracts:
  - contract: console.open
    kind: state
    version: 1
    summary: A console is open and recording.
    description: >
      Delivered by the action that opens an exec.console node. From then on everything the console
      prints is recorded. Tests that read boot output rely on this state being reached before the target
      boots.
    probe: The console reports it is open and its reader thread is alive.
    see_also:
      - exec.console
