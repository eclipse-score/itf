contracts:
  - contract: application.running
    kind: state
    version: 1
    summary: The application under test is running on the target.
    description: >
      A project-level state: the pack set does not ship an action for it, a project or product pack
      delivers it (start the application, wait until it answers). A target file lists it as a goal and
      relates it to the platform and image states.
    probe: Something the project defines, typically a health query on the application.
    see_also:
      - platform.up
      - image.present
