contracts:
  - contract: platform.instance
    kind: capability
    role: platform
    version: 1
    summary: The platform a target runs on, with a lifecycle the planner can bring up and observe.
    description: >
      Constructing the object creates nothing: the action delivering `platform.up` starts it
      and the teardown stops it. Other nodes (command, process, files, console, endpoint) take a platform
      as input and use what it exposes. `restart` simulates a reboot; after it, `target.reach()` brings
      every goal back.
    members:
      - name: start
        signature: "() -> None"
        semantics: Brings the platform up; called by the action for platform.up, not by tests.
      - name: running
        signature: "() -> bool"
        semantics: True while the platform is up; the probe of platform.up.
      - name: restart
        signature: "() -> None"
        semantics: Restarts the platform. Anything connected to it (SSH sessions) is dropped.
      - name: stop
        signature: "() -> None"
        semantics: Takes the platform down and releases what it created; idempotent.
    guarantees:
      - running() is true once the platform is up.
      - After restart() the platform is running again within a bounded time.
      - stop() can be called more than once.
    see_also:
      - platform.up
    conformance: score.itf.contracts.conformance.platform
