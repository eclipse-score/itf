contracts:
  - contract: network.reachable
    kind: state
    version: 1
    summary: The target's endpoint accepts connections from the test host.
    description: >
      Delivered alongside shell.open by the SSH pack, or by a network pack that waits for the endpoint.
      Routing and forwarding problems show up here instead of as a confusing timeout in a later test.
    probe: A TCP connection to the endpoint succeeds.
    see_also:
      - descriptor.endpoint
      - shell.open
