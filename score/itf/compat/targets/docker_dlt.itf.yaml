# docker.itf.yaml with the original dlt_plugin: DLT received on the host (dlt.receive), from --dlt-config.
include:
  - docker.itf.yaml
packs:
  dlt: score.itf.packs.dlt.plugin
capabilities:
  logs:
    factory: dlt.receive
    with:
      host_ip: ${LEGACY_DLT_HOST_IP:-127.0.0.1}
      multicast_ips: ${LEGACY_DLT_MULTICAST:-}
  # the dlt_on_target fixture: dlt-receive run on the target (--dlt-receive-on-target-path, else the bundled one)
  dlt_on_target:
    factory: dlt.on_target
    bind:
      files: files
      process: process
    with:
      binary_path: ${LEGACY_DLT_ON_TARGET:-}
