# Execution contracts: running commands and processes on a target, and the consoles and shells they
# run over. Block style only (no inline braces or brackets).
contracts:
  - contract: exec.command
    kind: capability
    role: command
    version: 1
    summary: Run one shell command and get its exit code and output.
    description: >
      The simplest way to act on a target: hand over a command line, get back what happened. Where the
      command runs depends on the factory (the host, a container, over SSH, on a serial console). Do not
      rely on state persisting between calls: a factory may start a fresh shell each time, while a console
      keeps one session. Prefer a child shell (`sh -c '...'`) when a command must not affect the session.
    members:
      - name: exec
        signature: "(command: str, timeout: float = 30.0) -> tuple[int, str]"
        semantics: >
          Returns the exit code and the output, stdout followed by stderr. A nonzero exit is returned,
          never raised. A command that does not finish within the timeout is an error of the factory.
    guarantees:
      - A nonzero exit code is returned, not raised.
      - The output contains what the command wrote to stdout and to stderr.
    see_also:
      - exec.shell
      - exec.process

  - contract: exec.process
    kind: capability
    role: process
    version: 1
    summary: Start a program asynchronously and control it through a handle.
    description: >
      For anything that must keep running while the test does something else: servers, load generators,
      long jobs. `spawn` returns at once with a process handle that reports its pid, whether it still
      runs, waits for it, stops it and returns what it printed. The handle is also what
      `score.itf.core.process.WrappedProcess` wraps, so processes from any factory coordinate the same way.
    members:
      - name: spawn
        signature: "(binary_path: str, args: list[str] | None = None, cwd: str = '/') -> AsyncProcess"
        semantics: >
          Starts the program (a plain command line is accepted as the first argument) in `cwd` and returns
          without waiting. The handle offers pid(), is_running(), wait(timeout_s), stop(),
          get_exit_code() and get_output().
    guarantees:
      - spawn returns before the program ends.
      - wait returns the program's exit code, and the handle then reports it is no longer running.
      - stop ends a running program (exit code 143 or 137) and the handle then reports it is not running.
      - get_output returns what the program wrote to stdout and stderr.
      - The program starts in the requested working directory.
    see_also:
      - exec.command

  - contract: exec.shell
    kind: capability
    role: shell
    version: 1
    summary: An open interactive shell session with separate stdout and stderr and a run-time limit.
    description: >
      A connected session (for example SSH) that offers more than one-shot commands: output split into
      lines, stdout and stderr kept apart or merged, a bound on how long a command may run. Those are the
      member `exec_lines`, which is not required: real SSH offers it, a simulation may not, so tests gate on
      it with `shape=["exec_lines"]` and its checks run only where it exists (the exit code is -1 when the
      command exceeds max_exec_time). Other capabilities (command, process, files) are built on top of one
      shell. The session is opened by the state `shell.open`.
    members:
      - name: exec
        signature: "(command: str, timeout: float = 30.0) -> tuple[int, str]"
        semantics: Exit code and stdout followed by stderr; never raises on a nonzero exit.
      - name: run
        signature: "(command: str, timeout: float = 30.0) -> str"
        semantics: Returns stdout; raises RuntimeError carrying stderr when the command exits nonzero.
      - name: exec_lines
        required: false
        signature: "(command: str, timeout: float | None = None, max_exec_time: float | None = None, separate_stderr: bool = True, log: bool = True) -> tuple[int, list[str], list[str]]"
        semantics: >
          Returns the exit code, the stdout lines and the stderr lines, each line keeping its newline. The
          exit code is -1 when the command exceeds max_exec_time.
    guarantees:
      - run raises on a nonzero exit; exec returns the code.
      - Where exec_lines is offered, line splitting preserves each newline and a command exceeding
        max_exec_time reports exit code -1.
    see_also:
      - exec.command
      - shell.open

  - contract: exec.console
    kind: capability
    role: console
    version: 1
    summary: A console (UART, emulator serial port) whose output is recorded from the moment it opens.
    description: >
      Everything the console prints is kept in a bounded buffer from the moment it opens, including boot
      messages, so a test can read what happened before it started. `mark` gives a cursor and `lines` /
      `wait_for` look only at lines received after it. `run` types a command and returns its exit code
      and output without the echo. The console is opened by the state `console.open`.
    members:
      - name: open
        signature: "() -> None"
        semantics: Opens the console and starts recording; normally done by the state, not by tests.
      - name: is_open
        signature: "() -> bool"
        semantics: True while the console is open and its reader is healthy.
      - name: close
        signature: "() -> None"
        semantics: Stops recording and releases the device; called at teardown.
      - name: write
        signature: "(text: str) -> None"
        semantics: Sends one line of text (a newline is appended). Raises RuntimeError when not open.
      - name: mark
        signature: "() -> int"
        semantics: A cursor for lines() and wait_for(); only lines received after this call count.
      - name: lines
        signature: "(since: int = 0) -> list[str]"
        semantics: "The recorded lines, from the cursor `since` (default: everything still buffered)."
      - name: wait_for
        signature: "(pattern: str, timeout: float = 30.0, *, since: int | None = None, regex: bool = False) -> str | None"
        semantics: The first line containing (or matching) the pattern after `since` (default now), or None on timeout.
      - name: run
        signature: "(command: str, timeout: float = 30.0) -> tuple[int, str]"
        semantics: Runs a shell command on the console; returns exit code and output without echo or marker.
    guarantees:
      - Output printed since the console opened is recorded, not only output after the first read.
      - lines(since=mark) returns only lines received after the mark was taken.
      - run reports the exit code of the command.
    see_also:
      - exec.command
      - console.open

  - contract: shell.open
    kind: state
    version: 1
    summary: A shell session is connected and can run commands.
    description: >
      Delivered by the action that connects an exec.shell node (SSH). It requires the platform to be up
      and is invalidated by anything that drops the connection, such as a restart. Reaching it again after
      a restart reconnects.
    probe: The session reports it is connected.
    see_also:
      - exec.shell
      - platform.up
      - network.reachable

  - contract: console.open
    kind: state
    version: 1
    summary: A console is open and recording.
    description: >
      Delivered by the action that opens an exec.console node. From then on everything the console
      prints is recorded. Tests that read boot output rely on this state being reached before the target
      boots.
    probe: The console reports it is open and its reader thread is alive.
    see_also:
      - exec.console

  - contract: application.running
    kind: state
    version: 1
    summary: The application under test is running on the target.
    description: >
      A project-level state: the pack set does not ship an action for it, a project or product pack
      delivers it (start the application, wait until it answers). A target file lists it as a goal and
      relates it to the platform and image states.
    probe: Something the project defines, typically a health query on the application.
    see_also:
      - platform.up
      - image.present
