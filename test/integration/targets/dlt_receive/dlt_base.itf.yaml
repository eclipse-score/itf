packs:
  docker: score.itf.packs.docker.plugin
capabilities:
  platform:
    factory: docker.platform
    with:
      image: score_itf_examples:latest
      bootstrap: ${ITF_IMAGE_LOAD}
      ports: "13490/tcp:${ITF_DLT_PORT:-13490}"   # the patched DLT build listens on 13490
  command: docker.exec
  process: docker.process
  files: docker.files
  daemon: local.dlt_daemon
  endpoint:
    factory: docker.endpoint
    with:
      port: 13490
