include:
  - dlt_base.itf.yaml
packs:
  dlt: score.itf.packs.dlt.plugin
capabilities:
  logs: dlt.receive_tcp
  dlt_on_target: dlt.on_target   # dlt-receive run on the container itself, through files and process
goals:
  # Three dlt actions could make this true: name the one for this way of receiving.
  - state: logs.active
    by: dlt.start_receive
relations:
  # Nothing sends before the daemon runs, so the subscription waits for it.
  - state: logs.active
    after:
      - daemon.running
