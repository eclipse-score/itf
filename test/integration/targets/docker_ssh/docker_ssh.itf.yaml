policies:
  - test/integration/targets/policy.py
packs:
  docker: score.itf.packs.docker.plugin
  net: score.itf.packs.net.plugin
  ssh: score.itf.packs.ssh.plugin
capabilities:
  platform:
    factory: docker.platform
    with:
      image: linuxserver/openssh-server:version-10.2_p1-r0
      command: null
      init: false
      environment: PASSWORD_ACCESS=true,USER_NAME=${SSH_USER},USER_PASSWORD=${SSH_PASSWORD}
      ports: 2222/tcp
      volumes: ${ITF_EXTRA_MOUNT}:/extra/mount:ro
  endpoint:
    factory: docker.endpoint
    with:
      port: 2222
  credentials:
    factory: net.password
    with:
      user: ${SSH_USER}
      password: ${SSH_PASSWORD}
  shell:
    factory: ssh.shell
    with:
      n_retries: 20
  command: ssh.exec
  process: ssh.process
  files: ssh.files
goals:
  - platform.up
  - network.reachable
  - shell.open
relations:
  # The session connects to a service of the container: the container runs first.
  - state: shell.open
    after:
      - platform.up
