contracts:
  - contract: acme/toggle
    kind: capability
    version: 1
    summary: A switch that starts off.
    description: Used by the command line tests.
    members:
      - name: is_on
        signature: "() -> bool"
        semantics: Whether the switch is on.
    conformance: cli_conformance
  - contract: acme/dial
    kind: capability
    version: 1
    summary: A dial.
    description: Used by the command line tests.
    members:
      - name: read
        signature: "() -> int"
        semantics: The position.
      - name: turn
        signature: "(to: int) -> None"
        semantics: Move it.
