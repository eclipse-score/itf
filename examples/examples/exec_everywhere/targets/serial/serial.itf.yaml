# A serial console on a shell over a pseudo-terminal: no container, no hardware.
policies:
  - examples/exec_everywhere/targets/policy.py
packs:
  serial: score.itf.packs.serial.plugin
capabilities:
  console: serial.pty_console
  command: serial.exec
goals:
  # The project's policy also has an action making this true (for serial_device): name the pack's.
  - state: console.open
    by: serial.open
