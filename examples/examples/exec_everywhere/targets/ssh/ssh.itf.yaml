# A container running sshd, reached over SSH: the SSH starter's target file (a platform, an endpoint, a login,
# a shell, `command`) plus `files`, so the same tests run as on container.itf.yaml with other factories.
include:
  - ../../../starter/ssh/targets/target.itf.yaml
policies:
  - examples/exec_everywhere/targets/policy.py
packs:
  ssh: score.itf.packs.ssh.plugin
capabilities:
  files: ssh.files
