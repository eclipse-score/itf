# A target with a simulated relay (the vendor's contract) and a status LED (the project's own contract).
# Swapping the simulation for real hardware is changing one word: `acme.simulated_relay` becomes the label of
# a factory that drives it. The test does not change.
policies:
  - examples/vendor_contract/targets/policy.py
packs:
  acme: acme.plugin             # the vendor's pack is not installed: say where it lives
capabilities:
  power: acme.simulated_relay
  led: local.status_led
