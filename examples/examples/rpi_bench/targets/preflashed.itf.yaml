# The card was flashed by hand (or by an earlier run): take image.flashed on faith instead of writing it. The
# flasher never runs then; these values only stand in for SD_MUX and RPI_IMAGE, which need no value here.
capabilities:
  flasher:
    with:
      sd_mux: unused
      image: unused
assume:
  - state: image.flashed
    owner: lab
    reason: the SD card was flashed by hand
