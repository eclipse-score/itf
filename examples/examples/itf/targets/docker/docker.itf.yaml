# The example application in a container: commands, programs and files through the container API.
policies:
  - examples/itf/targets/policy.py
packs:
  docker: score.itf.packs.docker.plugin
capabilities:
  platform:
    factory: docker.platform
    with:
      image: score_itf_examples:latest
      bootstrap: ${ITF_IMAGE_LOAD}
  command: docker.exec
  process: docker.process
  files: docker.files
goals:
  - platform.up
