# A target that sends DLT logs, received by the session (`logs`).
policies:
  - examples/itf/targets/policy.py
packs:
  dlt: score.itf.packs.dlt.plugin
  docker: score.itf.packs.docker.plugin
capabilities:
  platform:
    factory: docker.platform
    with:
      image: score_itf_dlt:latest
      bootstrap: ${ITF_IMAGE_LOAD}
      ports: 13490/tcp
  command: docker.exec
  process: docker.process
  daemon: local.dlt_daemon
  endpoint:
    factory: docker.endpoint
    with:
      port: 13490
  logs:
    factory: dlt.receive_tcp
goals:
  # The DLT receive tool uses the daemon's TCP endpoint.
  - state: logs.active
    by: dlt.start_receive
relations:
  # The project starts dlt-daemon (policy.py); nothing sends before it runs, so the subscription waits for it.
  - state: logs.active
    after:
      - daemon.running
